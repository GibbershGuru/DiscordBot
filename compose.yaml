services:
  bot:
    image: ${WINSTON_IMAGE:-ghcr.io/gibbershguru/discordbot:latest}
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?Set DISCORD_TOKEN in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      BOT_NAME: ${BOT_NAME:-Winston}
      BOT_OWNER_IDS: ${BOT_OWNER_IDS:-}
      WELCOME_CHANNEL_ID: ${WELCOME_CHANNEL_ID:-0}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      MAX_OUTPUT_TOKENS: ${MAX_OUTPUT_TOKENS:-120}
      SESSION_SECONDS: ${SESSION_SECONDS:-300}
      REMINDER_TIMEZONE: ${REMINDER_TIMEZONE:-Europe/Berlin}
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgres://${POSTGRES_USER:-winston}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-winston}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-winston}
      POSTGRES_USER: ${POSTGRES_USER:-winston}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - winston_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 10
volumes:
  winston_postgres:
